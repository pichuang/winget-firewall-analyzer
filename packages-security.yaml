# =============================================================================
# packages-security.yaml — 套件資安評估（人工維護）
# =============================================================================
# 此檔案由資安人員手動維護，定義每個套件的風險等級、MITRE ATT&CK 對照、
# 存取控制分級等資訊。自動產生 packages-list.md 時會合併此檔案的內容。
#
# 欄位說明：
#   risk_level:   high（🔴）/ medium（🟡）/ low（🟢），未列出的套件為 none（⚪）
#   risk_reason:  風險說明文字
#   mitre_tactic: MITRE ATT&CK 戰術分類
#   mitre_technique: ATT&CK 技術編號與名稱
#   red_team_use: 紅隊用途說明（僅高風險工具需要）
#   access_tier:  存取控制分級（1=僅 IT 管理員, 2=僅開發人員, 3=需申請審批, 4=一般使用者）
#   access_reason: 限制理由
# =============================================================================


# =============================================================================
# 🔴 高風險套件（可直接用於資料外洩、權限提升、繞過安全控制）
# =============================================================================
high_risk:
  - package_id: "Microsoft.Azure.AZCopy.10"
    risk_reason: "大量資料複製工具，可將本機資料上傳至任意 Azure Storage，潛在資料外洩管道"
    mitre_tactic: "資料外洩（Exfiltration）"
    mitre_technique: "T1567.002 雲端外洩"
    red_team_use: "大量複製資料至 Azure Storage，高速傳輸"
    access_tier: 2
    access_reason: "大量資料傳輸，外洩管道"

  - package_id: "Microsoft.Azure.DataCLI"
    risk_reason: "Azure 資料操作 CLI，可存取與傳輸雲端資料庫資料"
    mitre_tactic: "資料外洩（Exfiltration）"
    mitre_technique: "T1567.002 雲端外洩"
    red_team_use: "存取與傳輸雲端資料庫資料"
    access_tier: 2
    access_reason: "雲端資料庫操作"

  - package_id: "Microsoft.DTrace"
    risk_reason: "核心層級追蹤工具，可監控系統呼叫與核心行為"
    mitre_tactic: "防禦規避（Defense Evasion）"
    mitre_technique: "T1014 Rootkit 手法"
    red_team_use: "核心層級追蹤，監控系統呼叫"
    access_tier: 1
    access_reason: "核心層級追蹤"

  - package_id: "Microsoft.OneDrive"
    risk_reason: "雲端同步工具，可自動將本機檔案同步至個人 OneDrive，資料外洩風險"
    mitre_tactic: "資料外洩（Exfiltration）"
    mitre_technique: "T1567.002 雲端外洩"
    red_team_use: "自動同步本機檔案至個人雲端空間"
    access_tier: 3
    access_reason: "同步至個人雲端"

  - package_id: "Microsoft.PowerShell"
    risk_reason: "功能強大的命令列工具，可執行任意腳本、修改系統、存取網路，常被濫用於攻擊"
    mitre_tactic: "持久性與權限提升（Persistence / Privilege Escalation）"
    mitre_technique: "T1059.001 PowerShell"
    red_team_use: "**#1 攻擊工具**：執行混淆腳本、下載惡意程式、橫向移動、免檔案攻擊"
    access_tier: 1
    access_reason: "攻擊者 #1 工具，可執行任意腳本"

  - package_id: "Microsoft.RemoteDesktopClient"
    risk_reason: "遠端桌面用戶端，可連線至外部機器"
    mitre_tactic: "橫向移動（Lateral Movement）"
    mitre_technique: "T1021.001 RDP"
    red_team_use: "連線至內部或外部機器"
    access_tier: 3
    access_reason: "遠端連線需管控目標"

  - package_id: "Microsoft.RemoteHelp"
    risk_reason: "遠端協助工具，允許外部人員操控本機"
    mitre_tactic: "橫向移動（Lateral Movement）"
    mitre_technique: "T1021 遠端服務"
    red_team_use: "允許外部人員操控本機桌面"
    access_tier: 3
    access_reason: "外部人員操控本機"

  - package_id: "Microsoft.Sysinternals.ProcessExplorer"
    risk_reason: "進階工作管理員，可檢視所有程序詳情含安全性 token"
    mitre_tactic: "偵察與發現（Discovery）"
    mitre_technique: "T1057 程序發現"
    red_team_use: "列舉所有執行中程序、檢視安全性 token、識別防毒軟體"
    access_tier: 1
    access_reason: "進階程序分析含 token"

  - package_id: "Microsoft.Sysinternals.ProcessMonitor"
    risk_reason: "即時監控檔案系統、Registry、程序活動，可用於偵察敏感操作"
    mitre_tactic: "偵察與發現（Discovery）"
    mitre_technique: "T1057 / T1083"
    red_team_use: "即時監控檔案、Registry、網路活動，偵察目標系統行為"
    access_tier: 1
    access_reason: "系統活動即時監控"

  - package_id: "Microsoft.Sysinternals.PsExec"
    risk_reason: "遠端執行工具，常被攻擊者用於橫向移動"
    mitre_tactic: "橫向移動（Lateral Movement）"
    mitre_technique: "T1570 橫向工具傳輸"
    red_team_use: "在遠端機器上執行任意命令"
    access_tier: 1
    access_reason: "遠端執行任意命令"

  - package_id: "Microsoft.Sysinternals.SDelete"
    risk_reason: "安全刪除工具，可不可逆地銷毀檔案，妨礙數位鑑識"
    mitre_tactic: "防禦規避（Defense Evasion）"
    mitre_technique: "T1070.004 刪除指標"
    red_team_use: "安全刪除檔案，銷毀攻擊痕跡，妨礙數位鑑識"
    access_tier: 1
    access_reason: "銷毀檔案、妨礙鑑識"

  - package_id: "Microsoft.Sysinternals.Sysmon"
    risk_reason: "系統監控工具，可記錄所有程序活動，若被攻擊者利用可收集機密資訊"
    mitre_tactic: "偵察與發現（Discovery）"
    mitre_technique: "T1057 程序發現"
    red_team_use: "記錄所有程序活動與系統行為"
    access_tier: 1
    access_reason: "全系統行為記錄"

  - package_id: "Microsoft.WSL"
    risk_reason: "Windows Subsystem for Linux，提供完整 Linux 環境，可繞過 Windows 安全控制"
    mitre_tactic: "防禦規避（Defense Evasion）"
    mitre_technique: "T1202 間接指令執行"
    red_team_use: "在 Linux 子系統中執行命令，繞過 Windows EDR/防毒"
    access_tier: 1
    access_reason: "完整 Linux 環境，繞過 Windows EDR"

  - package_id: "Microsoft.WindowsApp"
    risk_reason: "Windows 365 / AVD 用戶端，可連線至外部虛擬桌面"
    mitre_tactic: "橫向移動（Lateral Movement）"
    mitre_technique: "T1021 遠端服務"
    red_team_use: "連線至 Windows 365 / AVD 虛擬桌面"
    access_tier: 3
    access_reason: "連線外部虛擬桌面"

  - package_id: "Microsoft.devtunnel"
    risk_reason: "建立 dev tunnel 反向隧道，可將內部服務暴露至公網，繞過防火牆"
    mitre_tactic: "防禦規避（Defense Evasion）"
    mitre_technique: "T1572 隧道"
    red_team_use: "建立反向隧道暴露內部服務至公網"
    access_tier: 1
    access_reason: "反向隧道繞過防火牆"


# =============================================================================
# 🟡 中風險套件（可間接協助攻擊、收集系統資訊、修改系統組態）
# =============================================================================
medium_risk:
  - package_id: "GitHub.Copilot"
    risk_reason: "AI 程式碼輔助工具，程式碼會傳送至雲端 AI 服務處理"
    access_tier: 3
    access_reason: "程式碼傳送至雲端 AI"

  - package_id: "GitHub.GitHubDesktop"
    risk_reason: "GitHub 桌面用戶端，可推送程式碼至外部 repository"
    access_tier: 2
    access_reason: "推送程式碼至外部"

  - package_id: "GitHub.GitLFS"
    risk_reason: "Git Large File Storage，可傳輸大型檔案至外部 Git 伺服器"
    mitre_tactic: "資料外洩（Exfiltration）"
    mitre_technique: "T1567 Web 服務外洩"
    red_team_use: "傳輸大型檔案至外部 Git 伺服器"
    access_tier: 2
    access_reason: "大型檔案外傳"

  - package_id: "GitHub.cli"
    risk_reason: "GitHub CLI，可操作 GitHub repository、建立 PR、存取 API"
    mitre_tactic: "資料外洩（Exfiltration）"
    mitre_technique: "T1567 Web 服務外洩"
    red_team_use: "透過 GitHub API 傳輸資料"
    access_tier: 2
    access_reason: "GitHub API 操作"

  - package_id: "Microsoft.Azure.Auth"
    risk_reason: "Azure 認證工具，管理雲端認證 token"
    access_tier: 2
    access_reason: "雲端認證管理"

  - package_id: "Microsoft.Azure.Az"
    risk_reason: "Azure PowerShell 模組，可管理所有 Azure 資源"
    access_tier: 2
    access_reason: "Azure PowerShell 管理"

  - package_id: "Microsoft.Azure.ConnectedMachineAgent"
    risk_reason: "Azure Arc Agent，可將機器連線至 Azure 管理平面"

    mitre_tactic: "橫向移動（Lateral Movement）"
    mitre_technique: "T1021.001 RDP"
    red_team_use: "管理多台機器的遠端桌面連線，連線資訊可能被竊取"
    access_tier: 4
    access_reason: "遠端桌面管理"

  - package_id: "Microsoft.Sysinternals.RegJump"
    risk_reason: "快速跳轉 Registry 位置，協助修改系統設定"
    access_tier: 4
    access_reason: "Registry 操作"

  - package_id: "Microsoft.Sysinternals.Sigcheck"
    risk_reason: "驗證檔案簽章，可用於識別未簽章的可執行檔"
    mitre_tactic: "偵察與發現（Discovery）"
    mitre_technique: "T1518 軟體發現"
    red_team_use: "識別未簽章或異常簽章的執行檔"
    access_tier: 4
    access_reason: "簽章驗證"

  - package_id: "Microsoft.Sysinternals.Strings"
    risk_reason: "擷取二進位檔中的字串，可用於分析程式或擷取內嵌密碼"

    access_reason: "除錯工具"

  - package_id: "Microsoft.Sysinternals.Handle"
    risk_reason: "檢視程序開啟的檔案 handle，可偵察敏感檔案存取"
    mitre_tactic: "偵察與發現（Discovery）"
    mitre_technique: "T1057 程序發現"
    red_team_use: "識別哪些程序正在存取特定檔案或 Registry"
    access_tier: 4
    access_reason: "程序 handle 檢視"

  - package_id: "Microsoft.Sysinternals.RAMMap"
    risk_reason: "分析實體記憶體，可能發現敏感資料"
    mitre_tactic: "記憶體分析（可擷取憑證）"
    mitre_technique: "T1003 憑證傾印"
    red_team_use: "分析實體記憶體，可能發現敏感資料"
    access_tier: 4
    access_reason: "記憶體分析"

  - package_id: "Microsoft.Sysinternals.RDCMan"

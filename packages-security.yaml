    access_reason: "連線 Azure 管理平面"

  - package_id: "Microsoft.Azure.Kubelogin"
    risk_reason: "Kubernetes 認證工具，可取得叢集存取權"
    access_tier: 2
    access_reason: "K8s 叢集認證"

  - package_id: "Microsoft.AzureCLI"
    risk_reason: "Azure 命令列工具，可管理所有 Azure 資源，需嚴格控管認證"
    access_tier: 2
    access_reason: "管理所有 Azure 資源"

  - package_id: "Microsoft.DebugDiag"
    risk_reason: "診斷與記憶體傾印分析工具"
    access_tier: 2
    access_reason: "記憶體傾印分析"

  - package_id: "Microsoft.DeploymentToolkit"
    risk_reason: "系統部署工具，可大規模修改作業系統映像"
    access_tier: 1
    access_reason: "大規模系統部署"

  - package_id: "Microsoft.DiskSpd"
    risk_reason: "磁碟效能測試工具，可產生大量 I/O 負載"
    access_tier: 4
    access_reason: "效能測試"

  - package_id: "Microsoft.Edge"
    risk_reason: "網頁瀏覽器，可存取任意網站，需搭配網頁過濾政策"
    access_tier: 3
    access_reason: "搭配網頁過濾政策即可"

  - package_id: "Microsoft.Git"
    risk_reason: "版本控制工具，可推送程式碼至外部 repository"
    mitre_tactic: "資料外洩（Exfiltration）"
    mitre_technique: "T1567 Web 服務外洩"
    red_team_use: "推送程式碼/檔案至外部 Git 伺服器"
    access_tier: 2
    access_reason: "推送程式碼至外部"

  - package_id: "Microsoft.LAPS"
    risk_reason: "本機管理員密碼管理，操作不當可能洩露密碼"
    mitre_tactic: "持久性與權限提升（Persistence / Privilege Escalation）"
    mitre_technique: "T1555 憑證儲存"
    red_team_use: "查詢本機管理員密碼，若權限控管不當可取得所有機器管理員密碼"
    access_tier: 1
    access_reason: "查詢本機管理員密碼"

  - package_id: "Microsoft.LogParser"
    risk_reason: "日誌分析工具，可查詢系統事件記錄擷取敏感資訊"
    mitre_tactic: "偵察與發現（Discovery）"
    mitre_technique: "T1005 本機資料收集"
    red_team_use: "查詢事件日誌擷取帳號、登入、敏感操作記錄"
    access_tier: 1
    access_reason: "查詢敏感事件日誌"

  - package_id: "Microsoft.MFCMapi"
    risk_reason: "MAPI 操作工具，可直接存取 Exchange 信箱資料"
    access_tier: 1
    access_reason: "直接存取 Exchange 信箱"

  - package_id: "Microsoft.Ntttcp"
    risk_reason: "網路效能測試工具，可產生大量網路流量"
    access_tier: 4
    access_reason: "網路效能測試"

  - package_id: "Microsoft.OSCDIMG"
    risk_reason: "建立 ISO 映像檔工具"
    access_tier: 1
    access_reason: "建立 ISO 映像"

  - package_id: "Microsoft.Pave"
    risk_reason: "封包驗證工具，可分析網路通訊"
    access_tier: 4
    access_reason: "網路分析"

  - package_id: "Microsoft.PerfView"
    risk_reason: "效能追蹤工具，追蹤檔可能包含敏感資料"
    access_tier: 4
    access_reason: "效能追蹤"

  - package_id: "Microsoft.SQLServerManagementStudio"
    risk_reason: "SQL Server 管理工具，可直接存取與操作資料庫"
    access_tier: 2
    access_reason: "直接操作資料庫"

  - package_id: "Microsoft.SmartDump"
    risk_reason: "記憶體傾印工具，傾印檔可能包含敏感資料"
    mitre_tactic: "記憶體分析（可擷取憑證）"
    mitre_technique: "T1003 憑證傾印"
    red_team_use: "產生程序記憶體傾印，傾印檔可能包含明文憑證"
    access_tier: 1
    access_reason: "記憶體傾印工具"

  - package_id: "Microsoft.SqlPackage"
    risk_reason: "資料庫匯出/匯入工具，可匯出整個資料庫"
    mitre_tactic: "資料外洩（Exfiltration）"
    mitre_technique: "T1005 本機資料收集"
    red_team_use: "匯出整個資料庫為 .bacpac 檔案"
    access_tier: 2
    access_reason: "匯出整個資料庫"

  - package_id: "Microsoft.Sqlcmd"
    risk_reason: "SQL 命令列工具，可執行任意 SQL 查詢"
    access_tier: 2
    access_reason: "執行任意 SQL"

  - package_id: "Microsoft.Sysinternals.Autoruns"
    risk_reason: "檢視所有自動啟動項目，可用於偵察與植入持久性後門"
    mitre_tactic: "偵察與發現（Discovery）"
    mitre_technique: "T1518 軟體發現"
    red_team_use: "列舉所有自動啟動項目，尋找可植入後門的位置"
    access_tier: 1
    access_reason: "自動啟動項偵察"

  - package_id: "Microsoft.Sysinternals.Autologon"
    risk_reason: "設定自動登入，將密碼明文儲存於 Registry"
    mitre_tactic: "持久性與權限提升（Persistence / Privilege Escalation）"

  - package_id: "Microsoft.WindowsADK"
    risk_reason: "Windows 評定與部署套件，可建立與修改系統映像"
    access_tier: 1
    access_reason: "建立/修改系統映像"

  - package_id: "Microsoft.etl2pcapng"
    risk_reason: "將 ETL 轉為 pcap 格式，可擷取與分析網路封包"

    red_team_use: "設定自動登入，將密碼明文儲存於 Registry"
    access_tier: 1
    access_reason: "明文儲存登入密碼"

  - package_id: "Microsoft.Sysinternals.DebugView"
    risk_reason: "擷取 debug 輸出訊息，可能包含敏感資訊"
